# Socialogy stack — NestJS + PostgreSQL.
# Credentials and config come from .env (see .env.example).
services:
  postgres:
    image: postgres:16-alpine
    container_name: socialogy-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: chengkh/socialogy-backend:latest
    build:
      context: ./social-network-app-backend
      dockerfile: Dockerfile
    container_name: socialogy-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      PORT: ${PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      UPLOAD_PATH: ${UPLOAD_PATH}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_SYNC: ${DB_SYNC}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    volumes:
      - backend_images:/app/images
    restart: unless-stopped

  frontend:
    image: chengkh/socialogy-frontend:latest
    build:
      context: ./social-network-app-frontend
      dockerfile: Dockerfile
      target: development
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: socialogy-frontend
    ports:
      - '3000:3000'
    environment:
      VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  backend_images:
