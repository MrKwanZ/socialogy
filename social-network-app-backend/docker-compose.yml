# Developer PostgreSQL for the NestJS backend (optional package-local compose).
# Root docker-compose.yaml is the full Nest + Postgres + frontend production stack.
# Credentials and config come from .env (see .env.example).
services:
  postgres:
    image: postgres:16-alpine
    container_name: socialogy-backend-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - '5432:5432'
    volumes:
      - socialogy_backend_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER} -d ${DB_DATABASE}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socialogy-backend-local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      UPLOAD_PATH: ${UPLOAD_PATH}
      # Compose service name — overrides DB_HOST=localhost used for host-side Nest.
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_SYNC: ${DB_SYNC}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    ports:
      - '8081:8080'
    volumes:
      - backend_images:/app/images
    restart: unless-stopped

volumes:
  socialogy_backend_pg_data:
  backend_images:
